# Cloudflare's Git integration runs this command from the repository root.
# Keep this root config in sync with cloudflare/wrangler.toml for local work.
name = "fourthwall"
main = "cloudflare/src/index.js"
compatibility_date = "2026-09-06"
workers_dev = true

# Must match cloudflare/wrangler.toml: a deploy replaces the Worker's plain-text vars with
# whatever this file lists, so a root deploy without them would remove them in production.
[vars]
SUPABASE_URL = "https://ltcbqxkyvjumjqzephbh.supabase.co"
SUPABASE_STORAGE_BUCKET = "project-files"
PUBLIC_APP_URL = "https://fourthwall.pages.dev/pwa/"
INQUIRY_NOTIFICATION_TO = "thefourthwall04.co@gmail.com"
# Resend's shared test sender only delivers to the email address that owns the Resend account.
# Once a domain is verified in Resend, change this to an address on that domain.
INQUIRY_FROM_EMAIL = "The Fourth Wall <onboarding@resend.dev>"
DROPBOX_SIGN_TEST_MODE = "true"
STUDIO_TIME_ZONE = "Asia/Kolkata"
STUDIO_UTC_OFFSET_MINUTES = "330"

[triggers]
crons = ["0 4 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "the-fourth-wall"
database_id = "f68bc3e1-6402-4f51-b381-8a6adb8782fc"
